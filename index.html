<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b14"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-180.png"><title>Metronom WAV v12</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script><style>:root{color-scheme:dark;--a:#ef4444;--a2:#fb923c;--g:#ef444455;--bg:#070b14;--p:#111a2c;--tx:#f8fafc}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 5%,var(--g),transparent 30rem),var(--bg);color:var(--tx);font-family:Inter,system-ui;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.glass{background:linear-gradient(145deg,var(--p),var(--bg));border:1px solid #ffffff18;box-shadow:0 25px 80px #0007}.range{appearance:none;width:100%;height:7px;border-radius:99px;background:linear-gradient(90deg,var(--a),var(--a) var(--v),#334155 var(--v))}.range::-webkit-slider-thumb{appearance:none;width:24px;height:24px;border-radius:50%;border:4px solid #fff;background:var(--a)}.tile.on{border-color:var(--a);background:var(--g)}.beat{width:12px;height:12px;border-radius:30px;background:#475569;transition:.12s}.beat.on{width:58px;background:linear-gradient(90deg,var(--a),var(--a2));box-shadow:0 0 30px var(--g)}.switch span{transition:.2s}.switch.on{background:var(--a)}.switch.on span{transform:translateX(24px)}.overlay{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:radial-gradient(circle,#fb923c55,transparent 50%),rgba(2,6,23,.97)}.overlay.hidden{display:none}.big{font-size:clamp(78px,26vw,180px);font-weight:1000;color:#fb923c}.seg{height:10px;flex:1;border-radius:99px;background:#ffffff1c}.seg.on{background:#fb923c}.light{color-scheme:light;--bg:#e5e7eb;--p:#f8fafc;--tx:#111827}.light .field{background:white;color:#111827}</style></head><body><video id="wakeVideo" src="wake.mp4" muted loop playsinline style="position:fixed;width:1px;height:1px;opacity:.001;pointer-events:none"></video><div id="ov" class="overlay hidden"><div class="w-full max-w-xl text-center"><p id="ovTitle" class="font-black tracking-[.22em] text-orange-300"></p><div id="ovBeat" class="big mt-8">1</div><div id="ovPhrase" class="mt-5 text-2xl font-black"></div><div id="ovWord" class="mt-3 text-xl font-black text-orange-300"></div><div id="ovSegs" class="mt-9 flex gap-2"></div><div class="mt-5 h-2 rounded-full bg-white/10"><div id="ovProg" class="h-full bg-orange-400" style="width:0"></div></div><p id="ovInfo" class="mt-4 text-xs font-black text-orange-200"></p></div></div><div class="mx-auto max-w-7xl px-4 py-5"><header class="mb-5 flex items-center justify-between border-b border-white/10 pb-5"><div><p class="text-[10px] font-black uppercase tracking-[.25em]" style="color:var(--a)">Andrzeja Łajdaka</p><h1 class="text-xl font-black sm:text-3xl">METRONOM <span class="font-light opacity-50">STUDIO WAV v12</span></h1></div><button id="reset" class="rounded-full bg-white/5 p-3"><i data-lucide="rotate-ccw"></i></button></header><main class="grid gap-5 lg:grid-cols-[.9fr_1.1fr]"><section class="glass flex min-h-[600px] flex-col rounded-[30px] p-6"><div class="flex justify-between"><div><p class="text-xs font-black uppercase" style="color:var(--a)">Tempo</p><div class="mt-3 flex items-end gap-3"><b id="bpmText" class="text-7xl sm:text-8xl">100</b><span class="mb-3 opacity-50">BPM</span></div></div><div><button id="minus" class="h-11 w-11 rounded-full bg-white/10">−</button><button id="plus" class="h-11 w-11 rounded-full bg-white/10">+</button></div></div><div class="mt-7 grid grid-cols-[1fr_105px] gap-4"><input id="bpm" class="range" style="--v:33%" type="range" min="30" max="240"><input id="manual" class="field rounded-xl bg-white/5 p-3 text-center font-black" type="number" min="30" max="240"></div><div id="spoken" class="mt-8 min-h-12 text-center text-4xl font-black" style="color:var(--a)"></div><div id="beats" class="my-auto flex min-h-20 items-center justify-center gap-3"></div><div class="mb-5 text-center text-xs opacity-60"><span id="barText">Takt 1</span> · <span id="beatText">Uderzenie 1</span></div><div class="grid gap-3 sm:grid-cols-[1fr_105px]"><button id="play" class="h-16 rounded-2xl text-lg font-black text-white" style="background:linear-gradient(90deg,var(--a),var(--a2))">START</button><button id="tap" class="h-16 rounded-2xl bg-white/5 font-black">TAP</button></div></section><div class="space-y-5"><section class="glass rounded-[28px] p-5"><h2 class="mb-4 text-xl font-black">Metrum</h2><div id="meters" class="grid grid-cols-3 gap-2 sm:grid-cols-6"></div></section><section class="glass rounded-[28px] p-5"><h2 class="text-xl font-black">Dźwięk i podział</h2><div id="sounds" class="mt-4 grid grid-cols-3 gap-2"></div><div id="divs" class="mt-3 grid grid-cols-2 gap-2 sm:grid-cols-4"></div></section><section class="glass rounded-[28px] p-5"><h2 class="text-xl font-black">Count-in</h2><div id="counts" class="mt-4 grid grid-cols-4 gap-2"></div></section><section class="glass rounded-[28px] p-5"><h2 class="mb-4 text-xl font-black">Timer</h2><div id="timers" class="grid grid-cols-4 gap-2"></div><div class="mt-4 flex items-center justify-between"><b id="timeLeft">Bez limitu</b><button id="cancelTimer" class="hidden rounded-xl bg-white/10 px-3 py-2 text-xs font-black">Anuluj</button></div></section><section class="glass rounded-[28px] p-5"><div class="flex justify-between"><div><h2 class="text-xl font-black">Utrzymuj ekran aktywny</h2><p id="wakeStatus" class="text-xs opacity-60">Wyłączone</p></div><button id="wake" class="switch h-8 w-14 rounded-full bg-slate-700 p-1"><span class="block h-6 w-6 rounded-full bg-white"></span></button></div></section><section class="glass rounded-[28px] p-5"><h2 class="mb-4 text-xl font-black">Kolor</h2><div id="themes" class="flex gap-4"><button data-theme="red" class="h-11 w-11 rounded-full bg-red-500"></button><button data-theme="blue" class="h-11 w-11 rounded-full bg-blue-500"></button><button data-theme="pink" class="h-11 w-11 rounded-full bg-pink-500"></button><button data-theme="light" class="h-11 w-11 rounded-full bg-slate-200"></button></div></section><section class="glass rounded-[28px] p-5"><div class="flex justify-between"><h2 class="text-xl font-black">Automatyczne przyspieszanie</h2><button id="acc" class="switch h-8 w-14 rounded-full bg-slate-700 p-1"><span class="block h-6 w-6 rounded-full bg-white"></span></button></div><div class="mt-4 grid grid-cols-2 gap-3"><select id="step" class="field rounded-xl bg-slate-950 p-3"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><input id="every" class="field rounded-xl bg-slate-950 p-3" type="number" min="1" max="99"></div></section><section class="glass rounded-[28px] p-5"><h2 class="mb-4 text-xl font-black">Mikser klików</h2><div id="mixer" class="space-y-3"></div></section></div></main></div><script>
(()=>{'use strict';const $=q=>document.querySelector(q),M=['2/4','3/4','4/4','5/4','6/8','7/8'],NUM=['one','two','three','four','five','six','seven'],WORDS=[...NUM,'and','e','a','trip','let'],DIV={quarter:['Ćwierćnuty',1],eighth:['Ósemki',2],triplet:['Triola',3],sixteenth:['Szesnastki',4]},DEF={bpm:100,meter:'4/4',sound:'click',division:'quarter',countIn:0,timer:0,theme:'red',beats:[],acc:{enabled:false,step:1,every:4}},KEY='metronom-wav-v12';let s;try{s={...DEF,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{s={...DEF}};s.acc={...DEF.acc,...s.acc};let ac,buffers={},loop,timerLoop,wakeLock,playing=false,counting=false,next=0,b=0,u=0,bars=0,vb=-1,taps=[],countSteps=0,totalCount=0,timerEnd=0,wakeEnabled=false;const beatCount=()=>+s.meter.split('/')[0],factor=()=>DIV[s.division][1],clamp=x=>Math.max(30,Math.min(240,Math.round(x||30))),save=()=>localStorage.setItem(KEY,JSON.stringify(s));function word(i,j){return s.division==='quarter'?NUM[i]:s.division==='eighth'?(j?'and':NUM[i]):s.division==='triplet'?[NUM[i],'trip','let'][j]:[NUM[i],'e','and','a'][j]}function norm(){s.beats=Array.from({length:beatCount()},(_,i)=>s.beats[i]||{enabled:true,volume:i?70:100})}async function loadAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();await ac.resume();if(Object.keys(buffers).length===WORDS.length)return true;await Promise.all(WORDS.map(async w=>{let r=await fetch(`audio/${w}.wav`,{cache:'no-store'});if(!r.ok)throw Error(`${w}.wav HTTP ${r.status}`);buffers[w]=await ac.decodeAudioData(await r.arrayBuffer())}));return true}catch(e){console.error('BŁĄD WAV:',e);return false}}function render(){norm();let th={red:['#ef4444','#fb923c','#ef444455'],blue:['#3b82f6','#22d3ee','#3b82f655'],pink:['#ec4899','#f472b6','#ec489955'],light:['#64748b','#94a3b8','#64748b33']}[s.theme];['--a','--a2','--g'].forEach((v,i)=>document.documentElement.style.setProperty(v,th[i]));document.body.classList.toggle('light',s.theme==='light');$('#bpmText').textContent=s.bpm;$('#bpm').value=$('#manual').value=s.bpm;$('#bpm').style.setProperty('--v',(s.bpm-30)/210*100+'%');$('#meters').innerHTML=M.map(x=>`<button data-m="${x}" class="tile ${x===s.meter?'on':''} rounded-xl border border-white/10 bg-white/5 p-3 font-black">${x}</button>`).join('');$('#sounds').innerHTML=[['click','Klik'],['oneAnd','One And'],['oneEAndA','One E And A']].map(x=>`<button data-s="${x[0]}" class="tile ${x[0]===s.sound?'on':''} rounded-xl border border-white/10 bg-white/5 p-3 text-xs font-black">${x[1]}</button>`).join('');$('#divs').innerHTML=Object.entries(DIV).map(([k,v])=>`<button data-d="${k}" class="tile ${k===s.division?'on':''} rounded-xl border border-white/10 bg-white/5 p-3 text-xs font-black">${v[0]}</button>`).join('');$('#counts').innerHTML=[0,1,2,4].map(x=>`<button data-c="${x}" class="tile ${x===s.countIn?'on':''} rounded-xl border border-white/10 bg-white/5 p-3 font-black">${x||'Brak'}</button>`).join('');$('#timers').innerHTML=[1,5,15,30].map(x=>`<button data-min="${x}" class="tile ${x===s.timer?'on':''} rounded-xl border border-white/10 bg-white/5 p-3 font-black">${x}m</button>`).join('');$('#beats').innerHTML=s.beats.map((x,i)=>`<i class="beat ${playing&&vb===i?'on':''}" style="opacity:${x.enabled?1:.2}"></i>`).join('');$('#barText').textContent='Takt '+(bars+1);$('#beatText').textContent='Uderzenie '+(vb<0?1:vb+1);$('#acc').classList.toggle('on',s.acc.enabled);$('#step').value=s.acc.step;$('#every').value=s.acc.every;$('#wake').classList.toggle('on',wakeEnabled);$('#mixer').innerHTML=s.beats.map((x,i)=>`<div class="grid grid-cols-[42px_1fr] gap-3 rounded-xl bg-white/5 p-3"><button data-x="${i}" class="rounded-xl" style="background:${x.enabled?'var(--a)':'#334155'}">${x.enabled?i+1:'×'}</button><input data-v="${i}" class="range" style="--v:${x.volume}%" type="range" min="0" max="100" value="${x.volume}"></div>`).join('');bind();lucide.createIcons();save()}function bind(){$('#meters').querySelectorAll('button').forEach(x=>x.onclick=()=>{s.meter=x.dataset.m;stop();render()});$('#sounds').querySelectorAll('button').forEach(x=>x.onclick=()=>{s.sound=x.dataset.s;if(s.sound==='oneAnd')s.division='eighth';if(s.sound==='oneEAndA')s.division='sixteenth';render()});$('#divs').querySelectorAll('button').forEach(x=>x.onclick=()=>{s.division=x.dataset.d;render()});$('#counts').querySelectorAll('button').forEach(x=>x.onclick=()=>{s.countIn=+x.dataset.c;render()});$('#timers').querySelectorAll('button').forEach(x=>x.onclick=()=>{s.timer=+x.dataset.min;render();if(playing)startTimer()});$('#mixer').querySelectorAll('[data-x]').forEach(x=>x.onclick=()=>{s.beats[x.dataset.x].enabled=!s.beats[x.dataset.x].enabled;render()});$('#mixer').querySelectorAll('[data-v]').forEach(x=>x.oninput=()=>{s.beats[x.dataset.v].volume=+x.value;render()})}function click(t,i,j){let c=s.beats[i];if(!c.enabled||!c.volume)return;let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=j?720:(i?930:1550);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(c.volume/220,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+.05);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.06)}function playSample(w,t=ac.currentTime+.03,gain=1){let src=ac.createBufferSource(),g=ac.createGain();src.buffer=buffers[w];g.gain.value=gain;src.connect(g);g.connect(ac.destination);src.start(t)}function schedule(){let f=factor();while((counting||playing)&&next<ac.currentTime+.12){let i=b,j=u,t=next,w=word(i,j),isCount=counting;if(s.sound==='click')click(t,i,j);else playSample(w,t,Math.max(.08,s.beats[i].volume/100));setTimeout(()=>{if(!playing&&!counting)return;vb=i;if(isCount){let done=totalCount-countSteps,pos=done%(beatCount()*f);$('#ovBeat').textContent=i+1;$('#ovWord').textContent=w;$('#ovSegs').innerHTML=Array.from({length:beatCount()*f},(_,q)=>`<span class="seg ${q<=pos?'on':''}"></span>`).join('');$('#ovProg').style.width=((done+1)/totalCount*100)+'%';$('#ovInfo').textContent=`PRZEDTAKT ${Math.floor(done/(beatCount()*f))+1}/${s.countIn} · ${w}`}else{$('#spoken').textContent=s.sound==='click'?'':w;render()}},Math.max(0,(t-ac.currentTime)*1000));next+=60/s.bpm/f;if(++u>=f){u=0;if(++b>=beatCount()){b=0;if(counting){countSteps-=beatCount()*f;if(countSteps<=0){counting=false;playing=true;bars=0;$('#ov').classList.add('hidden');$('#play').textContent='ZATRZYMAJ';if(s.timer)startTimer()}}else{bars++;if(s.acc.enabled&&bars%s.acc.every===0)s.bpm=Math.min(240,s.bpm+s.acc.step)}}}}}async function start(){if(!await loadAudio())return;b=u=bars=0;vb=-1;totalCount=countSteps=s.countIn*beatCount()*factor();counting=s.countIn>0;playing=!counting;next=ac.currentTime+.12;if(counting){$('#ov').classList.remove('hidden');$('#ovTitle').textContent=`PRZYGOTUJ SIĘ · ${s.meter} · ${DIV[s.division][0].toUpperCase()}`;$('#play').textContent='ANULUJ'}else{$('#play').textContent='ZATRZYMAJ';if(s.timer)startTimer()}loop=setInterval(schedule,20);schedule()}function stop(){clearInterval(loop);counting=playing=false;$('#ov').classList.add('hidden');b=u=bars=0;vb=-1;$('#spoken').textContent='';$('#play').textContent='START';render()}function setBpm(x){s.bpm=clamp(x);render()}function startTimer(){timerEnd=Date.now()+s.timer*60000;clearInterval(timerLoop);$('#cancelTimer').classList.remove('hidden');timerLoop=setInterval(()=>{let l=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));$('#timeLeft').textContent=`${String(Math.floor(l/60)).padStart(2,'0')}:${String(l%60).padStart(2,'0')}`;if(!l){clearInterval(timerLoop);s.timer=0;stop();$('#timeLeft').textContent='Koniec sesji'}},250)}function cancelTimer(){clearInterval(timerLoop);timerEnd=0;s.timer=0;$('#timeLeft').textContent='Bez limitu';$('#cancelTimer').classList.add('hidden');render()}async function toggleWake(){let video=$('#wakeVideo');if(wakeEnabled){if(wakeLock)try{await wakeLock.release()}catch{}wakeLock=null;video.pause();wakeEnabled=false;$('#wakeStatus').textContent='Wyłączone';render();return}try{if('wakeLock'in navigator&&isSecureContext){wakeLock=await navigator.wakeLock.request('screen');wakeEnabled=true;$('#wakeStatus').textContent='Aktywne: Screen Wake Lock'}else{await video.play();wakeEnabled=true;$('#wakeStatus').textContent='Aktywne: tryb zgodności iPhone/HTTP'}}catch(e){wakeEnabled=false;$('#wakeStatus').textContent='Błąd: '+e.message}render()}$('#play').onclick=()=>playing||counting?stop():start();$('#tap').onclick=()=>{const now=performance.now();taps=taps.filter(t=>now-t<2500);taps.push(now);if(taps.length>=2){const intervals=taps.slice(1).map((t,i)=>t-taps[i]);const recent=intervals.slice(-6);const average=recent.reduce((a,b)=>a+b,0)/recent.length;setBpm(60000/average)}const btn=$('#tap');btn.animate([{transform:'scale(1)'},{transform:'scale(.94)'},{transform:'scale(1)'}],{duration:180})};$('#bpm').oninput=e=>setBpm(e.target.value);$('#manual').onchange=e=>setBpm(e.target.value);$('#minus').onclick=()=>setBpm(s.bpm-1);$('#plus').onclick=()=>setBpm(s.bpm+1);$('#wake').onclick=toggleWake;$('#cancelTimer').onclick=cancelTimer;$('#acc').onclick=()=>{s.acc.enabled=!s.acc.enabled;render()};$('#step').onchange=e=>{s.acc.step=+e.target.value;render()};$('#every').onchange=e=>{s.acc.every=Math.max(1,+e.target.value||1);render()};$('#themes').querySelectorAll('button').forEach(x=>x.onclick=()=>{s.theme=x.dataset.theme;render()});$('#reset').onclick=()=>{stop();cancelTimer();s=JSON.parse(JSON.stringify(DEF));render()};document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&wakeEnabled&&'wakeLock'in navigator&&isSecureContext&&!wakeLock)try{wakeLock=await navigator.wakeLock.request('screen')}catch{}});render();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'))})();</script></body></html>
