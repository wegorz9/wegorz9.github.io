<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b14"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Metronom"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-180.png"><title>Andrzeja Łajdaka Metronom Studio</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script><style>
:root{color-scheme:dark;--a:#ff6b35;--m:#7cf7c4}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:radial-gradient(circle at 10% 5%,#ff6b3530,transparent 32rem),radial-gradient(circle at 90% 70%,#7cf7c418,transparent 30rem),#070b14;color:#eef2ff;font-family:Inter,system-ui,sans-serif}.glass{background:linear-gradient(145deg,#152037e8,#0a1020dd);border:1px solid #ffffff18;box-shadow:0 30px 90px #0007;backdrop-filter:blur(18px)}.range{appearance:none;width:100%;height:7px;border-radius:50px;background:linear-gradient(90deg,var(--a) 0,var(--a) var(--p),#28344a var(--p),#28344a);outline:0}.range::-webkit-slider-thumb{appearance:none;width:24px;height:24px;border-radius:50%;border:4px solid white;background:var(--a);box-shadow:0 0 20px #ff6b3577}.beat{width:12px;height:12px;border-radius:30px;background:#475569;transition:.14s}.beat.on{width:58px;background:linear-gradient(90deg,var(--a),#ffb17b);box-shadow:0 0 32px #ff6b3599}.row{transition:.15s}.row.on{border-color:#ff6b3588;background:#ff6b3518;transform:translateX(3px)}.switch span{transition:.2s}.switch.on{background:var(--m)}.switch.on span{transform:translateX(24px)}button{transition:.16s}button:active{transform:scale(.97)}
</style></head><body><div class="mx-auto min-h-screen max-w-7xl px-4 py-5 sm:px-7"><header class="mb-5 flex items-center justify-between border-b border-white/10 pb-5"><div class="flex items-center gap-3"><div class="grid h-12 w-12 place-items-center rounded-2xl bg-orange-500 shadow-[0_0_40px_#ff6b3555]"><i data-lucide="audio-waveform"></i></div><div><p class="text-[10px] font-black uppercase tracking-[.25em] text-orange-400">Andrzeja Łajdaka</p><h1 class="text-xl font-black sm:text-3xl">METRONOM <span class="font-light text-slate-500">STUDIO</span></h1></div></div><button id="reset" class="rounded-full border border-white/10 bg-white/5 p-3"><i data-lucide="rotate-ccw"></i></button></header><main class="grid gap-5 lg:grid-cols-[.9fr_1.1fr]"><section class="glass flex min-h-[570px] flex-col rounded-[30px] p-6"><div class="flex justify-between"><div><p class="text-xs font-black uppercase tracking-widest text-orange-400">Tempo</p><div class="mt-3 flex items-end gap-3"><b id="bpmv" class="text-7xl leading-none sm:text-8xl">100</b><span class="mb-2 font-black text-slate-500">BPM</span></div><p id="name" class="mt-3 font-bold text-slate-400">Andante</p></div><div class="flex gap-2"><button id="minus" class="h-11 w-11 rounded-full bg-white/10">−</button><button id="plus" class="h-11 w-11 rounded-full bg-white/10">+</button></div></div><input id="bpm" class="range mt-9" style="--p:33%" type="range" min="30" max="240" value="100"><div id="visual" class="my-auto flex min-h-24 items-center justify-center gap-3"></div><div class="mb-5 text-center text-xs font-bold text-slate-500"><span id="bar">Takt 1</span> · <span id="beat">Uderzenie 1</span></div><div class="grid gap-3 sm:grid-cols-[1fr_110px]"><button id="play" class="flex h-16 items-center justify-center gap-3 rounded-2xl bg-gradient-to-r from-orange-500 to-orange-400 text-lg font-black shadow-[0_16px_40px_#ff6b3544]"><i id="pi" data-lucide="play"></i><span id="pl">START</span></button><button id="tap" class="h-16 rounded-2xl border border-white/10 bg-white/5 font-black">TAP</button></div></section><div class="space-y-5"><section class="glass rounded-[28px] p-5"><div class="mb-4 flex justify-between"><div><p class="text-[10px] font-black uppercase tracking-widest text-orange-400">Metrum</p><h2 class="text-xl font-black">Wybierz puls</h2></div><b id="badge" class="rounded-full bg-orange-500/10 px-4 py-2 text-orange-300">4/4</b></div><div id="meters" class="grid grid-cols-3 gap-2 sm:grid-cols-6"></div></section><section class="glass rounded-[28px] p-5"><div class="flex justify-between"><div><p class="text-[10px] font-black uppercase tracking-widest text-emerald-300">Trener tempa</p><h2 class="text-xl font-black">Automatyczne przyspieszanie</h2><p id="as" class="mt-1 text-xs text-slate-500">Wyłączone</p></div><button id="at" class="switch h-8 w-14 rounded-full bg-slate-700 p-1"><span class="block h-6 w-6 rounded-full bg-white"></span></button></div><div class="mt-5 grid grid-cols-2 gap-3"><label class="rounded-2xl border border-white/10 bg-white/5 p-4 text-xs text-slate-400">Zwiększaj o<select id="step" class="mt-2 w-full rounded-xl bg-slate-950 p-3 font-black text-white"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label class="rounded-2xl border border-white/10 bg-white/5 p-4 text-xs text-slate-400">Co ile taktów<input id="every" type="number" min="1" max="99" value="4" class="mt-2 w-full rounded-xl bg-slate-950 p-3 font-black text-white"></label></div><div class="mt-5 flex justify-between text-[10px] font-black text-slate-500"><span>POSTĘP</span><span id="proglabel">0 / 4 TAKTÓW</span></div><div class="mt-2 h-2 overflow-hidden rounded-full bg-slate-800"><div id="prog" class="h-full w-0 rounded-full bg-emerald-300 transition-all"></div></div></section><section class="glass rounded-[28px] p-5"><h2 class="mb-4 text-xl font-black">Mikser klików</h2><div id="mixer" class="space-y-3"></div></section></div></main></div><script>
(()=>{'use strict';const M=['2/4','3/4','4/4','5/4','6/8','7/8'],key='metronom-pwa-v1',D={bpm:100,meter:'4/4',beats:[],acc:{enabled:false,step:1,every:4}};let s;try{s={...D,...JSON.parse(localStorage.getItem(key)||'{}')}}catch{s={...D}};let ctx,timer,playing=false,next=0,bi=0,bars=0,vbeat=-1,vbar=1,cycle=0,taps=[];const $=q=>document.querySelector(q),count=()=>+s.meter.split('/')[0],save=()=>localStorage.setItem(key,JSON.stringify(s));function norm(){s.beats=Array.from({length:count()},(_,i)=>s.beats[i]||{enabled:true,volume:i?70:100})}function tempo(){return s.bpm<60?'Largo':s.bpm<76?'Adagio':s.bpm<108?'Andante':s.bpm<120?'Moderato':s.bpm<168?'Allegro':'Presto'}function r(){norm();$('#bpmv').textContent=s.bpm;$('#name').textContent=tempo();$('#bpm').value=s.bpm;$('#bpm').style.setProperty('--p',(s.bpm-30)/210*100+'%');$('#badge').textContent=s.meter;$('#meters').innerHTML=M.map(x=>`<button data-m="${x}" class="rounded-xl border p-3 font-black ${x===s.meter?'border-white bg-white text-slate-950':'border-white/10 bg-white/5 text-slate-400'}">${x}</button>`).join('');$('#visual').innerHTML=s.beats.map((b,i)=>`<i class="beat ${playing&&vbeat===i?'on':''}" style="opacity:${b.enabled?1:.2}"></i>`).join('');$('#bar').textContent='Takt '+vbar;$('#beat').textContent='Uderzenie '+(vbeat<0?1:vbeat+1);$('#at').classList.toggle('on',s.acc.enabled);$('#step').value=s.acc.step;$('#every').value=s.acc.every;$('#step').disabled=$('#every').disabled=!s.acc.enabled;$('#as').textContent=s.acc.enabled?`+${s.acc.step} BPM co ${s.acc.every} taktów`:'Wyłączone';$('#proglabel').textContent=`${cycle} / ${s.acc.every} TAKTÓW`;$('#prog').style.width=(s.acc.enabled?cycle/s.acc.every*100:0)+'%';$('#mixer').innerHTML=s.beats.map((b,i)=>`<div data-r="${i}" class="row ${playing&&i===vbeat?'on':''} grid grid-cols-[42px_1fr_42px] items-center gap-3 rounded-2xl border border-white/10 bg-white/5 p-3"><button data-t="${i}" class="h-10 rounded-xl ${b.enabled?(i?'bg-white text-slate-950':'bg-orange-500'):'bg-slate-800 text-slate-500'} font-black">${b.enabled?i+1:'×'}</button><div><div class="mb-2 flex justify-between text-xs"><b>${i?'Klik '+(i+1):'Akcent'}</b><span>${b.volume}%</span></div><input data-v="${i}" class="range" style="--p:${b.volume}%" type="range" min="0" max="100" value="${b.volume}" ${b.enabled?'':'disabled'}></div><button data-t="${i}">🔊</button></div>`).join('');$('#meters').querySelectorAll('button').forEach(b=>b.onclick=()=>{s.meter=b.dataset.m;stop();r();save()});$('#mixer').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{s.beats[b.dataset.t].enabled=!s.beats[b.dataset.t].enabled;r();save()});$('#mixer').querySelectorAll('[data-v]').forEach(x=>x.oninput=()=>{s.beats[x.dataset.v].volume=+x.value;r();save()});lucide.createIcons();save()}function snd(t,i){let b=s.beats[i];if(!b.enabled||!b.volume)return;let o=ctx.createOscillator(),g=ctx.createGain();o.type=i?'sine':'triangle';o.frequency.value=i?900:1500;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(b.volume/220,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+.06);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.07)}function sched(){while(playing&&next<ctx.currentTime+.1){let i=bi,t=next,bn=bars+1,cy=s.acc.enabled?(bars%s.acc.every)+1:0;snd(t,i);setTimeout(()=>{if(playing){vbeat=i;vbar=bn;if(i===0)cycle=cy;r()}},Math.max(0,(t-ctx.currentTime)*1000));next+=60/s.bpm;bi=(bi+1)%count();if(!bi){bars++;if(s.acc.enabled&&bars%s.acc.every===0){s.bpm=Math.min(240,s.bpm+s.acc.step);save()}}}}async function start(){ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();playing=true;bi=bars=cycle=0;vbeat=-1;vbar=1;next=ctx.currentTime+.06;timer=setInterval(sched,25);sched();$('#pl').textContent='ZATRZYMAJ';$('#pi').setAttribute('data-lucide','pause');r()}function stop(){clearInterval(timer);playing=false;bi=bars=cycle=0;vbeat=-1;vbar=1;$('#pl').textContent='START';$('#pi').setAttribute('data-lucide','play');r()}$('#play').onclick=()=>playing?stop():start();$('#bpm').oninput=e=>{s.bpm=+e.target.value;r();save()};$('#minus').onclick=()=>{s.bpm=Math.max(30,s.bpm-1);r();save()};$('#plus').onclick=()=>{s.bpm=Math.min(240,s.bpm+1);r();save()};$('#at').onclick=()=>{s.acc.enabled=!s.acc.enabled;cycle=bars=0;r();save()};$('#step').onchange=e=>{s.acc.step=+e.target.value;r();save()};$('#every').onchange=e=>{s.acc.every=Math.max(1,Math.min(99,+e.target.value||1));cycle=bars=0;r();save()};$('#tap').onclick=()=>{let n=performance.now();taps=taps.filter(x=>n-x<2500);taps.push(n);if(taps.length>1){let a=taps.slice(1).map((x,i)=>x-taps[i]);s.bpm=Math.max(30,Math.min(240,Math.round(60000/(a.reduce((x,y)=>x+y)/a.length))));r();save()}};$('#reset').onclick=()=>{stop();s=JSON.parse(JSON.stringify(D));s.beats=[];r()};document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playing?stop():start()}});r();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'))})();
</script></body></html>
