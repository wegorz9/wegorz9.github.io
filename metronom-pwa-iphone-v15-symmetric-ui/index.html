(()=>{'use strict';const $=q=>document.querySelector(q),M=['2/4','3/4','4/4','5/4','6/8','7/8'],NUM=['one','two','three','four','five','six','seven'],WORDS=[...NUM,'and','e','a','trip','let'],DIV={quarter:['1/4',1],eighth:['1/8',2],triplet:['Triola',3],sixteenth:['1/16',4]},DEF={bpm:100,meter:'4/4',sound:'click',division:'quarter',countIn:0,timer:0,theme:'red',wake:true,beats:[],acc:{enabled:false,step:1,every:4}},KEY='metronom-wav-v15';let s;try{s={...DEF,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{s={...DEF}};s.acc={...DEF.acc,...s.acc};let ac,buffers={},loop,timerLoop,wakeLock,playing=false,counting=false,next=0,b=0,u=0,bars=0,vb=-1,taps=[],countSteps=0,totalCount=0,timerEnd=0,wakeEnabled=false;const beatCount=()=>+s.meter.split('/')[0],factor=()=>DIV[s.division][1],clamp=x=>Math.max(30,Math.min(240,Math.round(x||30))),save=()=>localStorage.setItem(KEY,JSON.stringify(s));function word(i,j){return s.division==='quarter'?NUM[i]:s.division==='eighth'?(j?'and':NUM[i]):s.division==='triplet'?[NUM[i],'trip','let'][j]:[NUM[i],'e','and','a'][j]}function norm(){s.beats=Array.from({length:beatCount()},(_,i)=>s.beats[i]||{enabled:true,volume:i?70:100})}async function loadAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();await ac.resume();if(Object.keys(buffers).length===WORDS.length)return true;await Promise.all(WORDS.map(async w=>{let r=await fetch(`audio/${w}.wav`,{cache:'no-store'});if(!r.ok)throw Error(`${w}.wav HTTP ${r.status}`);buffers[w]=await ac.decodeAudioData(await r.arrayBuffer())}));return true}catch(e){console.error('BŁĄD WAV:',e);return false}}function render(){norm();let th={red:['#ef4444','#fb923c','#ef444455'],blue:['#3b82f6','#22d3ee','#3b82f655'],pink:['#ec4899','#f472b6','#ec489955'],light:['#64748b','#94a3b8','#64748b33']}[s.theme];['--a','--a2','--g'].forEach((v,i)=>document.documentElement.style.setProperty(v,th[i]));document.body.classList.toggle('light',s.theme==='light');$('#bpmText').textContent=s.bpm;$('#bpm').va
